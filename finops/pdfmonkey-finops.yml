specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: PDFMonkey
providerId: pdfmonkey
created: '2026-06-25'
modified: '2026-06-25'
reconciled: true
tags:
- PDF
- Document Generation
- Templates
- HTML to PDF
- Documents
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of PDFMonkey spend. PDFMonkey bills via tiered monthly
  subscriptions metered by the number of documents generated per month, with
  fixed allowances per plan (Free, Starter, Pro, Pro+, Premium). Overage is
  charged through Boost Packs (EUR 5 per 1,000 documents) or pay-as-you-go on
  higher tiers, and annual billing yields a 10% discount.
notes: >-
  Subscription prices, document allowances, and overage terms are subject to
  change; verify against the PDFMonkey pricing page during reconciliation.
sources:
- https://www.pdfmonkey.io/pricing
- https://docs.pdfmonkey.io
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: PDFMonkey
serviceCategory: Document Generation
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: EUR
  chargeCategories:
  - Usage
  - Purchase
meters:
- name: documents_generated
  description: >-
    Documents generated in the billing period, counted against the plan's
    monthly allowance.
  unit: documents
  aggregation: sum
  dimensions:
  - account
  - workspace
  - document_template
- name: boost_pack_documents
  description: >-
    Additional documents purchased via Boost Packs (EUR 5 per 1,000) beyond the
    plan allowance.
  unit: documents
  aggregation: sum
  dimensions:
  - account
- name: subscription_seat
  description: >-
    Fixed monthly subscription charge for the active plan tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: >-
    Track documents generated per workspace and template against the monthly
    allowance to anticipate overage before it occurs.
- name: Allocation
  description: >-
    Use the meta field and per-workspace usage to map document generation to
    teams, clients, or internal cost centers.
- name: Optimization
  description: >-
    Right-size the plan tier to actual monthly volume; prefer annual billing for
    the 10% discount; use Boost Packs for occasional spikes rather than
    over-provisioning a higher tier.
- name: Accountability
  description: >-
    Assign owners per workspace and review monthly document consumption against
    the plan allowance and budget.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
